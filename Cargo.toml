[package]
name = "hue-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Per-segment brightness for Philips Hue gradient lights: a stand-in Hue bridge for Hue Sync clients"
license = "AGPL-3.0-or-later"
repository = "https://github.com/m-torun/hue-relay"
readme = "README.md"
keywords = ["hue", "philips-hue", "hue-sync", "smart-home", "lighting"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
mdns-sd = "0.22.0"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
webrtc-dtls = "0.12.0"
webrtc-util = "0.11"
